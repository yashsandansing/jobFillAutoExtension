<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Fill Settings</title>
  <style>
    body {
      margin: 0;
      background: #f6f7f9;
      color: #1f2933;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    p {
      margin: 0;
      color: #5f6b7a;
      line-height: 1.5;
    }

    section {
      margin-top: 24px;
      padding: 20px;
      background: #fff;
      border: 1px solid #d9dee7;
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #3e4c59;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }

    .field-row {
      display: grid;
      grid-template-columns: auto 1.3fr 1fr 1fr 1.2fr auto;
      gap: 12px;
      align-items: end;
      padding: 14px 0;
      border-top: 1px solid #edf0f5;
    }

    .field-row:first-child {
      border-top: 0;
    }

    .field-row.dragging {
      opacity: 0.55;
    }

    .field-row.drag-over {
      background: #f1f5ff;
      outline: 2px dashed #93b4f8;
      outline-offset: 4px;
    }

    .drag-handle {
      align-self: stretch;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      padding: 0 8px;
      border: 1px dashed #cbd2d9;
      border-radius: 8px;
      color: #52606d;
      font-size: 12px;
      font-weight: 700;
      cursor: grab;
      user-select: none;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .default-value-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .default-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-weight: 600;
    }

    .default-toggle input {
      width: auto;
    }

    .checks {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      padding-bottom: 10px;
    }

    .checks label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-weight: 600;
    }

    .checks input {
      width: auto;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: #e5eaf1;
      color: #1f2933;
    }

    button.danger {
      background: #dc2626;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      padding-bottom: 1px;
    }

    .row-actions button {
      padding: 9px 10px;
    }

    #status {
      min-height: 20px;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #15803d;
    }

    .empty-state {
      padding: 20px;
      border: 1px dashed #cbd2d9;
      border-radius: 10px;
      color: #5f6b7a;
      text-align: center;
    }

    @media (max-width: 760px) {
      .grid,
      .field-row {
        grid-template-columns: 1fr;
      }

      .drag-handle {
        min-height: 36px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Job Fill Settings</h1>
    <p>Configure the Google Sheet destination and arrange fields in the same order as your sheet columns.</p>

    <section>
      <div class="grid">
        <div>
          <label for="sheetId">Google Sheet ID</label>
          <input id="sheetId" type="text" placeholder="The long ID in the Google Sheet URL">
        </div>
        <div>
          <label for="tabName">Tab Name</label>
          <input id="tabName" type="text" placeholder="Sheet1">
        </div>
      </div>
    </section>

    <section>
      <h2>Fields</h2>
      <p>Use field order to match your Google Sheet columns. Required fields appear first in the popup; optional fields are behind See more.</p>
      <div id="fields"></div>
      <div class="actions">
        <button id="addField" type="button" class="secondary">Add Field</button>
        <button id="save" type="button">Save Settings</button>
      </div>
      <div id="status"></div>
    </section>
  </main>

  <script src="settings.js"></script>
</body>
</html>
