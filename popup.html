<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 1.2em;
    }
    .settings-toggle {
      font-size: 11px;
      color: #007bff;
      cursor: pointer;
      text-align: right;
      margin-top: 10px;
    }
    #settings {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ccc;
    }
    .error { color: #d9534f; }
    .success { color: #5cb85c; }
  </style>
</head>
<body>
  <div class="form-group">
    <label for="organization">ORGANIZATION</label>
    <input type="text" id="organization" placeholder="e.g. Google">
  </div>
  <div class="form-group">
    <label for="role">ROLE</label>
    <input type="text" id="role" placeholder="e.g. Software Engineer">
  </div>
  <div class="form-group">
    <label for="jobLink">JOB LINK</label>
    <input type="text" id="jobLink" placeholder="Job posting URL">
  </div>
  
  <button id="submit">Submit to Sheets</button>
  <div id="status"></div>

  <div class="settings-toggle" id="toggleSettings">Sheet Settings (Expand)</div>
  <div id="settings">
    <div class="form-group">
      <label for="sheetId">Google Sheet ID</label>
      <input type="text" id="sheetId" placeholder="The long ID in the URL">
    </div>
    <div class="form-group">
      <label for="tabName">Tab Name (optional)</label>
      <input type="text" id="tabName" placeholder="Sheet1" value="Sheet1">
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
