<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 340px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1f2933;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }

    input, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    button.secondary {
      background-color: #e5eaf1;
      color: #1f2933;
      margin-top: 8px;
    }

    button.secondary:hover {
      background-color: #d7dee8;
    }

    button.link {
      width: auto;
      padding: 0;
      margin: 4px 0 12px;
      background: transparent;
      color: #007bff;
      font-size: 12px;
      text-decoration: underline;
    }

    button.link:hover {
      background: transparent;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      min-height: 1.2em;
    }

    #setupPrompt {
      display: none;
      padding: 12px;
      border: 1px solid #f2c94c;
      border-radius: 6px;
      background: #fff8df;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    #optionalFields {
      display: none;
    }

    #seeMore {
      display: none;
    }

    .error { color: #d9534f; }
    .success { color: #5cb85c; }
  </style>
</head>
<body>
  <div id="setupPrompt">
    Configure a Sheet ID, tab name, and at least one field before submitting applications.
    <button id="setupSettings" type="button" class="secondary">Open Settings</button>
  </div>

  <div id="form">
    <div id="visibleFields"></div>
    <button id="seeMore" type="button" class="link">See more fields</button>
    <div id="optionalFields"></div>
    <button id="submit">Submit to Sheets</button>
  </div>

  <div id="status"></div>
  <button id="openSettings" type="button" class="secondary">Settings</button>

  <script src="popup.js"></script>
</body>
</html>
