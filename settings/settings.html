<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Job Fill Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-shell">
    <main class="settings-main" id="settingsMain">
      <!-- JS renders here -->
    </main>
    <aside class="settings-sidebar">
      <div class="preview-card">
        <div class="preview-label">Live preview</div>
        <div class="preview-frame" id="previewFrame"></div>
        <div class="preview-hint">Updates as you edit fields</div>
      </div>
    </aside>
  </div>
  <div class="save-bar" id="saveBar">
    <span class="save-status" id="saveStatus"></span>
    <button type="button" id="saveBtn" class="save-btn">Save settings</button>
  </div>
  <script src="settings.js"></script>
</body>
</html>
